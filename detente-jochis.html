<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FixZone</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #0a0a0a;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(920px, calc(100vw - 28px));
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        box-shadow: 0 22px 70px rgba(47, 111, 255, 0.22);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./assets/qr/detente-jochis.jpeg" alt="Detente jochis" />
    </main>
  </body>
</html>
